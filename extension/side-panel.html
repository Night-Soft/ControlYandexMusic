<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Yandex Music</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/popup.css">
    <link rel="stylesheet" href="css/side-panel.css">
    <script defer src="js/theme.js"></script>
</head>

<body>
    <div class="notification">
        <h2 class="h2-notification">Notification</h2>
        <div class="notification-time-left"></div>
        <div class="close-notification"></div>
    </div>

    <div class="back-colors">
        <div class="color1"></div>
        <div class="color2"></div>
    </div>

    <div class="modal ">
        <div class="image-container">
            <img class="modal-cover"></img>
        </div>
    </div>
    <div class="content-track ">
        <div class="covers">
            <div class="cover"></div>
            <div class="cover prev-cover"></div>
        </div>
        <div class="content-track-artist ">
            <div class="title name-track ">Track</div>
            <div class="title name-artists ">Artists</div>
        </div>
    </div>

    <div class="controls-container">
        <div class="side-controls container-toggles">
            <div class="content-toggle">
                <div class="toggle">
                    <div class="toggle-shuffle btns"></div>
                </div>
                <div class="toggle">
                    <div class="toggle-repeat btns"> </div>
                </div>
                <div class="content-groove-volume">
                    <div class="toggle">
                        <div class="toggle-volume btns"></div>
                    </div>
                    <div class="slider-content volume-content">
                        <div class="slider">
                            <div class="slider-groove slider-groove-volume">
                                <div class="slider-groove-current slider-groove-current-volume"></div>
                            </div>
                            <div class="handle-toltip">
                                <div class="slider-toltip slider-toltip-volume "></div>
                                <div class="slider-handle handle-volume"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="container-player-bar">
            <div class="controls-overlay">
                <div class="progress"></div>
            </div>
            <div class="controls-content">
                <div class="slider-content progress-content">
                    <span class="current-time">00:00</span>
                    <div class="slider  slider-progress ">
                        <div class="slider-groove slider-groove-progress">
                            <div class="loading-bar"></div>
                            <div class="loading-waiting-bar"></div>
                            <div class="slider-groove-current slider-groove-current-progress"></div>
                            <div class="slider-handle progress-handle"></div>
                        </div>
                        <div class="handle-toltip">
                            <div class="slider-toltip"></div>
                        </div>
                    </div>
                    <span class="duration">00:00</span>
                </div>

                <div class="content content-btn">
                    <div id="Previous" class="control control-popup">
                        <div class="btns btn-previous"></div>
                    </div>
                    <div id="Pause" class="pause control control-popup">
                        <div class="btns btn-pause"></div>
                    </div>
                    <div id="Next" class="next control control-popup">
                        <div class="btns btn-next"></div>
                    </div>
                    <div class="like control control-popup">
                        <div class="btns btn-like"></div>
                    </div>
                    <div class="dislike control control-popup">
                        <div class="btns btn-dislike"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="side-controls container-windows-btn">
            <div class="popup-gotab-container">
                <div class="btns btn-popup"></div>
                <div class="btns btn-go-tab"></div>
            </div>
        </div>
    </div>

    <div id="listTrack" class="modal-list-menu modal-list-menu-popup">
        <div class="track-position-top"></div>
        <div class="track-position-bottom"></div>
        <div class="list-track">
            <div class="title-content">
                <div class="title-cover"></div>
                <div class="title-list">Title</div>
            </div>
        </div>
    </div>

    <div class="no-connect">
        <div class="no-connect-content">
            <h2 id="AppDetected">App detected tab with "Yandex Music" but can't connect to the tab!</h2>
            <div class="loader-container">
                <div class="loader ">
                    <div class="loader2"></div>
                </div>
            </div>
            <div class="question">
                <h2 id="AppQuestion">Reload the tab or open new?</h2>
                <div class="open-in-tab">
                    <label id="labelOpenCurTab" for="checkboxOpenCurTab">Open in current tab?</label>
                    <input class="switcher" type="checkbox" id="checkboxOpenCurTab">
                </div>
            </div>

            <div class="yes-no-new">
                <button id="Yes" class="no-conect-btn">Yes</button>
                <button id="New" class="no-conect-btn">New Yandex Music Tab</button>
            </div>
        </div>
    </div>
    <script defer src="js/general-utils.js"></script>
    <script defer src="js/ExecutionDelay.js"></script>
    <script defer src="js/general-elements.js"></script>
    <script defer src="js/popup.js "></script>
    <script defer src="js/slider.js"></script>
    <script defer src="js/player.js"></script>
    <script defer src="js/translate.js"></script>
</body>

</html>
